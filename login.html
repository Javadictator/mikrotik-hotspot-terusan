<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Penting untuk responsif -->
  <title>Hotspot Login</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: sans-serif;
      font-size: 1rem;                /* Basis font size */
    }

    h2 {
      font-size: 1.5rem;              /* Lebih besar dan jelas */
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }

    button {
      padding: 14px 28px;
      font-size: 1.1rem;              /* Tombol menonjol */
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: #fff;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    p {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    a + button {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <h2>Tekan tombol di bawah untuk lanjut ke portal utama</h2>

  <!-- Tombol Intent Android (HTTPS/HTTP disesuaikan) -->
  <a href="intent://terusan.network/login2.html#Intent;scheme=http;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end">
    <button>Buka di Browser Default</button>
  </a>

  <p>Jika di Windows, coba:</p>
  <a href="microsoft-edge:http://terusan.network/login2.html">
    <button>Buka di Edge</button>
  </a>

</body>
</html>
